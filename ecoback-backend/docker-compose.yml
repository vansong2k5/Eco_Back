services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: ecoback_user
      POSTGRES_PASSWORD: ecoback_password
      POSTGRES_DB: ecoback_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  pgdata:
